[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
compileSdk = "37"
minSdk = "26"
jvmTarget = "17"

activity = "1.13.0"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
coroutines = "1.11.0"
datastore = "1.3.0"
detekt = "1.23.8"
junit = "4.13.2"
kover = "0.9.11"
ktlint = "1.8.0"
ktor = "3.6.1"
lifecycle = "2.11.0"
qrcodegen = "1.8.0"
robolectric = "4.17"
room = "2.8.5"
serialization = "1.12.0"
spotless = "8.11.0"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
tvMaterial = "1.1.0"
