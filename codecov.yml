coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%
comment:
  layout: 'condensed_header, diff, files'
  require_changes: true
ignore:
  - apps/docs/**
  - '**/test/**'
  - '**/e2e/**'
  - android/**/src/test/**
  - android/**/src/androidTest/**
