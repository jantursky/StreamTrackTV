name: Bug report
description: Something crashes, shows wrong numbers, or doesn't match the docs.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead. Include the error message or the log output if there is one.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android app
        - Web dashboard
        - Docs
        - Schema package (streamtrack-tv)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model
      placeholder: Xiaomi TV Stick 4K
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: Android TV 12 (build number from Settings > Device Preferences > About)
  - type: input
    id: version
    attributes:
      label: App or package version
      placeholder: 1.0.0
  - type: dropdown
    id: deployment
    attributes:
      label: How the dashboard is deployed
      description: Leave empty for the Android app and the schema package.
      options:
        - Hosted by the maintainer
        - Self-hosted on Vercel
        - Self-hosted on another platform
        - Local development
